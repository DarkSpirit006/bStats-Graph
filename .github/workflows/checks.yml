name: Checks

on:
  push:
    paths: ["**.py", pyproject.toml, .github/workflows/checks.yml]
  pull_request:
    paths: ["**.py", pyproject.toml, .github/workflows/checks.yml]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install ruff pyright mypy

      - name: Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Pyright
        run: pyright

      - name: Mypy
        run: mypy
